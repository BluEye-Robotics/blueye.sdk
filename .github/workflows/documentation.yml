name: Build and deploy documentation

on:
  pull_request:
  push:
    branches:
      - master
  release:
    types: [released]

jobs:
  BuildDocumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
         version: "0.7.11"
      - name: Build documentation
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site

  DeployDocumentation:
    needs: BuildDocumentation
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
         version: "0.7.11"
      - name: Setup git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Pull gh-pages
        run: |
          git fetch origin gh-pages --depth=1
          git checkout gh-pages
          git pull origin gh-pages --depth=1
          git checkout -
      - name: Set variables
        run: |
          full_version="v$(cut -d ' ' -f 2 <<< "$(uv version)")"
          major_minor="$(cut -d '.' -f 1 <<< "$full_version")"."$(cut -d '.' -f 2 <<< "$full_version")"
          echo "full_version=$full_version" >> $GITHUB_ENV
          echo "major_minor=$major_minor" >> $GITHUB_ENV
      - name: Deploy master
        if: github.event_name == 'push'
        run: |
          uv run mike deploy dev
      - name: Deploy release
        if: github.event_name == 'release'
        run: |
          uv run mike deploy --title ${{ env.full_version }} --update-aliases ${{ env.major_minor }} latest
      - name: Checkout gh-pages branch
        run: git checkout gh-pages
      - name: Push to gh-pages
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          branch: gh-pages
